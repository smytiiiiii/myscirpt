# =============================================================
#  Configuration du serveur FiveM
# =============================================================

# --- Réseau ---------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Ressources -----------------------------------------------
# Ressources système (fournies avec FXServer)
ensure chat
ensure sessionmanager
ensure hardcap
ensure rconlog

# Ressources par défaut (dossier resources/)
ensure mapmanager
ensure spawnmanager
ensure baseevents
ensure basic-gamemode
ensure fivem-map-skater
ensure playernames

# Tes ressources perso (resources/[local]/)
ensure basic_core

# --- Infos du serveur -----------------------------------------
sv_hostname "Mon Serveur FiveM"
sets sv_projectName "Mon Serveur FiveM"
sets sv_projectDesc "Serveur freeroam basique"
sets tags "freeroam, fr"
sets locale "fr-FR"
#load_server_icon logo.png   # image PNG 96x96

sv_maxclients 32
set onesync on

# Empêche les clients d'utiliser ScriptHookV (mods/cheats)
sv_scriptHookAllowed 0

# Mot de passe RCON (laisser commenté pour désactiver)
#rcon_password "changeme"

# Clé API Steam (optionnel, pour les identifiants steam:)
set steam_webApiKey "none"

# --- Permissions ----------------------------------------------
# Le groupe admin peut utiliser toutes les commandes (dont /announce)
add_ace group.admin command allow
add_ace group.admin command.quit deny

# Ajoute-toi en admin : remplace par ton identifiant
# (visible dans la console du serveur quand tu te connectes)
#add_principal identifier.fivem:1234567 group.admin
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.admin

# --- Clé de licence -------------------------------------------
# La clé est dans secrets.cfg (non versionné). Copie secrets.cfg.example
# en secrets.cfg et mets ta clé de https://portal.cfx.re
exec secrets.cfg
